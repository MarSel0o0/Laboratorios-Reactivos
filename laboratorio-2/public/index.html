<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Threads</title>
    <link rel="stylesheet" href="/main.css" />
  </head>
  <body>
    <section>
      <h1>Threads</h1>
      <!-- Inicio P5: formulario para crear un nuevo thread -->
      <form id="thread-form">
        <input type="text" id="author" placeholder="Author" required />
        <input type="text" id="content" placeholder="Content" required />
        <button type="submit">Publicar</button>
      </form>
      <!-- Fin P5 -->
      <div class="container">
      <!-- div para agrupar el <ul> y aplicarle estilos -->
        <ul id="threads" class="threads"></ul>
        <!-- lista sin ordenar, se llena via spa.js -->
      </div>
    </section>
    <script src="/spa.js"></script>
  </body>
</html>
